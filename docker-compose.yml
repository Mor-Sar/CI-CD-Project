services:
  flask_app:
    build: .
    expose:
      - "5000"
    networks:
      - flashcards_net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask_app
    networks:
      - flashcards_net

networks:
  flashcards_net:
    driver: bridge
