version: "3.9"

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb_db
    environment:
      MARIADB_DATABASE: ${MYSQL_DB}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - flashcards_net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  flask_app:
    build: .
    expose:
      - "5000"
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - flashcards_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)\""
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      flask_app:
        condition: service_healthy
    networks:
      - flashcards_net

networks:
  flashcards_net:
    driver: bridge

volumes:
  mariadb_data:
