version: "3.9"

services:
  flask_app:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    networks:
      - flashcards_net

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask_app
    networks:
      - flashcards_net

networks:
  flashcards_net:
    driver: bridge
