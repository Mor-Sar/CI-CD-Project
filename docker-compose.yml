version: "3.9"

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb_db
    environment:
      MARIADB_DATABASE: flashcards
      MARIADB_USER: flashcards_user
      MARIADB_PASSWORD: flashcards_pass
      MARIADB_ROOT_PASSWORD: root_pass_change_me
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - flashcards_net

  flask_app:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - flashcards_net

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask_app
    networks:
      - flashcards_net

networks:
  flashcards_net:
    driver: bridge

volumes:
  mariadb_data:
