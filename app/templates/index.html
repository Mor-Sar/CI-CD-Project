<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Flashcards Multi-Format</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <div class="app-shell">
        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="top-left">
                <h1 class="app-title">Study Cards</h1>
                <p class="app-subtitle">
                    Create smart flashcards, summaries and quizzes for your study topics.
                </p>
            </div>

            <div class="top-right">
                <!-- אלו ה־IDs שה-app.js מצפה להם -->
                <span id="userInfoLabel" class="user-info">Not logged in</span>

                <a id="loginLink" href="/login" class="btn ghost small">
                    Login
                </a>

                <button id="logoutBtn" class="btn ghost small" style="display: none;">
                    Logout
                </button>

                <span id="healthStatus" class="badge badge-gray">
                    Checking backend...
                </span>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <main class="layout">
            <!-- LEFT COLUMN: TOPICS -->
            <section class="pane pane-left">
                <div class="pane-card">
                    <h2>New Topic</h2>
                    <form id="topic-form" class="form-vertical">
                        <label>
                            Topic name
                            <!-- app.js מחפש topicInput -->
                            <input
                                type="text"
                                id="topicInput"
                                placeholder="e.g. Docker volumes"
                                required
                            />
                        </label>

                        <div class="chip-group">
                            <label class="chip">
                                <input type="checkbox" class="format-checkbox" value="flashcard" checked>
                                Flashcard
                            </label>
                            <label class="chip">
                                <input type="checkbox" class="format-checkbox" value="summary" checked>
                                Summary
                            </label>
                            <label class="chip">
                                <input type="checkbox" class="format-checkbox" value="quiz">
                                Quiz
                            </label>
                            <label class="chip">
                                <input type="checkbox" class="format-checkbox" value="task">
                                Task
                            </label>
                            <label class="chip">
                                <input type="checkbox" class="format-checkbox" value="usecase">
                                Usecase
                            </label>
                            <label class="chip">
                                <input type="checkbox" class="format-checkbox" value="mindmap">
                                Mindmap
                            </label>
                        </div>

                        <!-- בחירה בין dummy ל-AI (app.js כבר יודע לעבוד עם mode) -->
                        <div class="mode-row">
                            <label>
                                <input type="radio" name="mode" value="dummy" checked>
                                Dummy mode
                            </label>
                            <label>
                                <input type="radio" name="mode" value="ai">
                                AI mode
                            </label>
                        </div>

                        <!-- app.js מחפש createBtn -->
                        <button type="button" id="createBtn" class="primary-btn full-width">
                            Create Topic
                        </button>
                    </form>

                    <!-- app.js מצפה ל-createStatus -->
                    <div id="createStatus" class="message"></div>
                </div>

                <div class="pane-card">
                    <h2>My Topics</h2>
                    <!-- app.js מחפש topicsList -->
                    <ul id="topicsList" class="topics-list"></ul>
                </div>
            </section>

            <!-- RIGHT COLUMN: CARDS -->
            <section class="pane pane-right">
                <div class="pane-card">
                    <div class="pane-header-row">
                        <!-- app.js מחפש cardsTitle -->
                        <h2 id="cardsTitle">Your topic flashcards</h2>

                        <div class="filter-row">
                            <label for="cardTypeFilter">Filter</label>
                            <!-- app.js מחפש cardTypeFilter -->
                            <select id="cardTypeFilter">
                                <option value="">All</option>
                                <option value="flashcard">Flashcard</option>
                                <option value="summary">Summary</option>
                                <option value="quiz">Quiz</option>
                                <option value="task">Task</option>
                                <option value="usecase">Usecase</option>
                                <option value="mindmap">Mindmap</option>
                            </select>
                        </div>
                    </div>

                    <!-- app.js מחפש cardsContainer -->
                    <div id="cardsContainer" class="cards-grid"></div>
                </div>
            </section>
        </main>

        <!-- toast קטן להודעות (app.js משתמש בו אם קיים) -->
        <div id="toast" class="toast hidden"></div>
    </div>
</body>
</html>
