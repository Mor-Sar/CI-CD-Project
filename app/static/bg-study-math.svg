<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- דוגמת "מחברת" עדינה -->
    <pattern id="notebook" x="0" y="0" width="140" height="140" patternUnits="userSpaceOnUse">
      <rect width="140" height="140" fill="none" />
      <!-- קווים אופקיים דקים -->
      <line x1="0" y1="20" x2="140" y2="20" stroke="#cbd5f5" stroke-width="0.6" opacity="0.25" />
      <line x1="0" y1="40" x2="140" y2="40" stroke="#cbd5f5" stroke-width="0.6" opacity="0.25" />
      <line x1="0" y1="60" x2="140" y2="60" stroke="#cbd5f5" stroke-width="0.6" opacity="0.25" />
      <line x1="0" y1="80" x2="140" y2="80" stroke="#cbd5f5" stroke-width="0.6" opacity="0.25" />
      <line x1="0" y1="100" x2="140" y2="100" stroke="#cbd5f5" stroke-width="0.6" opacity="0.25" />
      <line x1="0" y1="120" x2="140" y2="120" stroke="#cbd5f5" stroke-width="0.6" opacity="0.25" />
      <!-- קו "שוליים" כמו במחברת -->
      <line x1="25" y1="0" x2="25" y2="140" stroke="#f97373" stroke-width="0.7" opacity="0.28" />
    </pattern>

    <style>
      .icon-line {
        fill: none;
        stroke: #475569;
        stroke-width: 1.7;
        opacity: 0.55;             /* מודגש יותר אבל לא אגרסיבי */
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-fill {
        fill: #e2e8f0;
        opacity: 0.45;
      }
      .icon-text {
        fill: #475569;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 24px;
        opacity: 0.65;
      }
      .formula {
        fill: #64748b;
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 26px;
        opacity: 0.7;
      }
    </style>
  </defs>

  <!-- שכבת "מחברת" על כל המסך -->
  <rect width="1600" height="900" fill="url(#notebook)" />

  <!-- ספר פתוח -->
  <g transform="translate(180 190) scale(1.3)">
    <path class="icon-fill" d="M2 10 L70 5 L135 10 L135 85 L70 80 L2 85 Z" />
    <path class="icon-line" d="M2 10 L70 5 L135 10 L135 85 L70 80 L2 85 Z" />
    <line class="icon-line" x1="70" y1="5" x2="70" y2="80" />
    <!-- שורות טקסט -->
    <line class="icon-line" x1="15" y1="25" x2="60" y2="28" />
    <line class="icon-line" x1="15" y1="40" x2="58" y2="43" />
    <line class="icon-line" x1="80" y1="28" x2="125" y2="30" />
    <line class="icon-line" x1="80" y1="43" x2="120" y2="45" />
  </g>

  <!-- מחברת + עט -->
  <g transform="translate(1170 160) scale(1.2)">
    <rect x="0" y="0" width="120" height="165" rx="12" class="icon-fill" />
    <rect x="0" y="0" width="120" height="165" rx="12" class="icon-line" />
    <!-- שורות במחברת -->
    <line class="icon-line" x1="15" y1="30" x2="100" y2="30" />
    <line class="icon-line" x1="15" y1="50" x2="100" y2="50" />
    <line class="icon-line" x1="15" y1="70" x2="100" y2="70" />
    <line class="icon-line" x1="15" y1="90" x2="90" y2="90" />
    <line class="icon-line" x1="15" y1="110" x2="78" y2="110" />
    <!-- עט אלכסוני -->
    <path class="icon-line" d="M115 140 L155 100 L165 110 L125 150 Z" />
    <circle cx="160" cy="105" r="3" class="icon-line" />
  </g>

  <!-- נורת "רעיון" -->
  <g transform="translate(340 560) scale(1.25)">
    <circle cx="60" cy="40" r="30" class="icon-fill" />
    <circle cx="60" cy="40" r="30" class="icon-line" />
    <path class="icon-line" d="M47 63 L47 80 L73 80 L73 63" />
    <line class="icon-line" x1="50" y1="84" x2="70" y2="84" />
    <!-- קרני אור -->
    <line class="icon-line" x1="60" y1="4" x2="60" y2="-10" />
    <line class="icon-line" x1="36" y1="10" x2="27" y2="0" />
    <line class="icon-line" x1="84" y1="10" x2="93" y2="0" />
  </g>

  <!-- כרטיס פלש קטן -->
  <g transform="translate(1020 560) scale(1.15)">
    <rect x="0" y="0" width="160" height="100" rx="16" class="icon-fill" />
    <rect x="0" y="0" width="160" height="100" rx="16" class="icon-line" />
    <text x="20" y="40" class="icon-text">Q:</text>
    <text x="50" y="40" class="icon-text">What is Docker?</text>
    <text x="20" y="70" class="icon-text">A:</text>
    <text x="50" y="70" class="icon-text">Tool for containers</text>
  </g>

  <!-- נוסחאות מתמטיות / מדעיות -->
  <text x="880" y="260" class="formula">E = mc²</text>
  <text x="250" y="330" class="formula">Σ aᵢ · xᵢ</text>
  <text x="1180" y="420" class="formula">∫ f(x) dx</text>
  <text x="760" y="160" class="formula">π · r²</text>
  <text x="540" y="430" class="formula">x² + y² = r²</text>

  <!-- סימני + , √ , = -->
  <text x="260" y="140" class="icon-text">+</text>
  <text x="1360" y="260" class="icon-text">√x</text>
  <text x="980" y="620" class="icon-text"> = </text>
</svg>
