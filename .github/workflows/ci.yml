name: CI - Test and Notify

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docker-compose tests
        run: |
          docker compose --profile test up --build --abort-on-container-exit --exit-code-from test

      - name: Print success message
        run: echo "success"

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans

  notify_email_on_failure:
    needs: test
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Test Failed: ${{ github.repository }} @ ${{ github.ref_name }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Tests failed in the CI pipeline.
            
            Failure Details:
            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Actor: ${{ github.actor }}
            
            View full logs and failure details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
