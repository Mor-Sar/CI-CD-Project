name: CI - Test, Build and Push

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docker-compose tests
        run: |
          docker compose --profile test up --build --abort-on-container-exit --exit-code-from test

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans

  build_and_push:
    needs: test
    runs-on: ubuntu-latest

    # מומלץ לדחוף ל-Docker Hub רק מ-main כדי לא להציף Images.
    # אם את רוצה בכל branch - אפשר להסיר את התנאי הזה.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flashcards:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flashcards:${{ github.sha }}

  notify_email_on_failure:
    needs: [test, build_and_push]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI failed: ${{ github.repository }} @ ${{ github.ref_name }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            CI failed.
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}

            Run URL:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
