name: CI

on:
  push:
    branches: ["sarah-new"]
  pull_request:
    branches: ["sarah-new"]

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << EOF
          MYSQL_DB=flashcards
          MYSQL_USER=flashcards_user
          MYSQL_PASSWORD=flashcards_pass
          MYSQL_HOST=mariadb
          MYSQL_PORT=3306
          JWT_SECRET=ci-secret
          JWT_EXPIRES_MINUTES=60
          AI_PROVIDER=gemini
          GEMINI_API_KEY=dummy
          GEMINI_MODEL=gemini-2.0-flash
          OPENAI_API_KEY=dummy
          OPENAI_MODEL=gpt-4.1-mini
          EOF

      - name: Build and start services
        run: docker compose up -d --build

      - name: Show container status
        run: docker compose ps

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 1) HEALTH CHECK (נפרד)
      - name: Health check - /health responds
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if curl -fsS http://localhost/health > /dev/null; then
              echo "Health OK"
              exit 0
            fi
            sleep 2
          done

          echo "Health endpoint did not become ready"
          docker compose logs --tail=200 flask_app
          docker compose logs --tail=200 nginx
          docker compose logs --tail=200 mariadb
          exit 1

      # 2) AUTH SETUP (נפרד)
      - name: Auth setup - register + login + validate token
        run: |
          set -euo pipefail

          TS=$(date +%s)
          USERNAME="ci_user_$TS"
          EMAIL="ci_$TS@example.com"
          PASSWORD="ci_password_$TS"

          echo "Register"
          curl -sS -X POST http://localhost/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USERNAME\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            | jq . || true

          echo "Login"
          LOGIN_RESP=$(curl -fsS -X POST http://localhost/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")

          TOKEN=$(echo "$LOGIN_RESP" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: missing .token in login response"
            echo "$LOGIN_RESP"
            docker compose logs --tail=200 flask_app
            exit 1
          fi

          echo "Validate token via /auth/me"
          if ! curl -fsS http://localhost/auth/me -H "Authorization: Bearer $TOKEN" | jq .; then
            echo "/auth/me failed - showing logs"
            docker compose logs --tail=200 flask_app
            exit 1
          fi

          # Persist token for later steps
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      # 3) SMOKE TEST חיובי (נפרד)
      - name: Smoke test - create topic + cards and verify skip logic
        run: |
          set -euo pipefail

          TS=$(date +%s)
          TOPIC="ci-topic-$TS"

          echo "Create topic with cards"
          CREATE_RESP=$(curl -fsS -X POST http://localhost/topics \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$TOPIC\",\"formats\":[\"flashcard\",\"summary\"],\"mode\":\"dummy\"}")

          echo "$CREATE_RESP" | jq .

          CREATED=$(echo "$CREATE_RESP" | jq '.created_card_types | length')
          SKIPPED=$(echo "$CREATE_RESP" | jq '.skipped_card_types | length')

          if [ "$CREATED" -ne 2 ]; then
            echo "ERROR: expected 2 created_card_types, got $CREATED"
            docker compose logs --tail=200 flask_app
            exit 1
          fi
          if [ "$SKIPPED" -ne 0 ]; then
            echo "ERROR: expected 0 skipped_card_types on first create, got $SKIPPED"
            docker compose logs --tail=200 flask_app
            exit 1
          fi

          echo "Repeat request - expect skip"
          REPEAT_RESP=$(curl -fsS -X POST http://localhost/topics \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$TOPIC\",\"formats\":[\"flashcard\",\"summary\"],\"mode\":\"dummy\"}")

          echo "$REPEAT_RESP" | jq .

          CREATED2=$(echo "$REPEAT_RESP" | jq '.created_card_types | length')
          SKIPPED2=$(echo "$REPEAT_RESP" | jq '.skipped_card_types | length')

          if [ "$CREATED2" -ne 0 ]; then
            echo "ERROR: expected 0 created_card_types on repeat, got $CREATED2"
            docker compose logs --tail=200 flask_app
            exit 1
          fi
          if [ "$SKIPPED2" -ne 2 ]; then
            echo "ERROR: expected 2 skipped_card_types on repeat, got $SKIPPED2"
            docker compose logs --tail=200 flask_app
            exit 1
          fi

          echo "Smoke test passed"

      - name: Shutdown
        if: always()
        run: docker compose down -v
